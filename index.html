<!DOCTYPE html>

<title> Cassie Nguyen's Mystery File </title>

<link rel="stylesheet" href="Game.css">

<body>

<div id="SplashScreen">
<h1>Game Title</h1>
<input id="StartButton" type="button" value="Start"/>
</div>

<canvas id="GameCanvas" style="display: none;">Game Stuff</canvas>

<script>

        $("#GameCanvas").show();
    });
</script>
